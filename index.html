<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Przepraszam ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2a0a18, #0d0509 75%);
      color: #ff8fb1;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .ekran {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 2;
    }

    .ukryty {
      display: none !important;
    }

    .serce {
      font-size: clamp(10px, 2.2vw, 22px);
      line-height: 1.05;
      letter-spacing: 1px;
      white-space: pre;
      color: #ff4d6d;
      text-shadow: 0 0 18px rgba(255, 77, 109, 0.65);
      animation: bicie 1.3s ease-in-out infinite;
      user-select: none;
    }

    .serce span {
      display: inline-block;
      transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.1s ease;
    }

    .napis {
      margin-top: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(28px, 6vw, 50px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff0f5;
      text-shadow: 0 0 20px rgba(255, 143, 177, 0.5);
    }

    .pytanie {
      margin-top: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(18px, 3.8vw, 24px);
      font-weight: 600;
      color: #ffd6e0;
    }

    .przyciski {
      margin-top: 24px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 700;
      padding: 12px 32px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .tak {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.45);
    }

    .tak:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 26px rgba(255, 77, 109, 0.7);
    }

    .nie {
      background: rgba(255, 255, 255, 0.1);
      color: #ffb3c6;
      border: 1px solid rgba(255, 179, 198, 0.35);
    }

    .nie:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.04);
    }

    .ekran-tak h1 {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(32px, 6vw, 56px);
      color: #fff0f5;
      text-shadow: 0 0 25px rgba(255, 77, 109, 0.8);
      animation: wyskok 0.7s ease forwards;
    }

    .ekran-tak p {
      margin-top: 14px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(16px, 3.5vw, 22px);
      color: #ffd6e0;
      max-width: 480px;
      line-height: 1.5;
    }

    .tlo-dymku {
      position: fixed;
      inset: 0;
      background: rgba(8, 3, 6, 0.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
      animation: pojawienie 0.25s ease forwards;
    }

    .dymek {
      position: relative;
      max-width: 420px;
      width: 100%;
      background: #fff0f5;
      color: #2a0a18;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      border-radius: 24px;
      padding: 24px 26px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 143, 177, 0.35);
      text-align: left;
      animation: dymekAnim 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .dymek::after {
      content: "";
      position: absolute;
      bottom: -14px;
      left: 42px;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 16px solid #fff0f5;
    }

    .tag {
      display: inline-block;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      background: #ffe0ea;
      color: #b51743;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .dymek h2 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #1f0610;
    }

    .dymek p {
      font-size: 16px;
      line-height: 1.5;
      color: #3d1223;
    }

    .dymek-dol {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }

    .ponow {
      font-size: 15px;
      padding: 9px 20px;
      background: #ff4d6d;
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 77, 109, 0.35);
    }

    .ponow:hover {
      background: #e63958;
      transform: scale(1.04);
    }

    .iskra {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      font-size: 24px;
      animation: lot 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes bicie {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.1); }
      30% { transform: scale(0.98); }
      45% { transform: scale(1.07); }
      60% { transform: scale(1); }
    }

    @keyframes wyskok {
      0% { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes pojawienie {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes dymekAnim {
      0% { opacity: 0; transform: translateY(14px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes lot {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); }
    }
  </style>
</head>
<body>

  <div id="start" class="ekran">
    <pre id="serce" class="serce"></pre>
    <h1 class="napis">Przepraszam</h1>
    <p class="pytanie">Wybaczysz mi? 🥺</p>
    <div class="przyciski">
      <button class="tak" id="btnTak">Tak ❤️</button>
      <button class="nie" id="btnNie">Nie 💔</button>
    </div>
  </div>

  <div id="koniec" class="ekran ekran-tak ukryty">
    <h1>Dziękuję, Zosiu! ❤️</h1>
    <p>Jesteś dla mnie najważniejsza!</p>
  </div>

  <div id="overlay" class="tlo-dymku ukryty">
    <div class="dymek" id="dymek">
      <span id="tag" class="tag">ERROR_404:</span>
      <h2 id="tytul">Coś tu nie działa... 🥺</h2>
      <p id="tekst">Przepraszam za wszystko, bardzo mi zależy, żebyś mi wybaczyła. Spróbujesz jeszcze raz? ❤️</p>
      <div class="dymek-dol">
        <button class="ponow" id="btnPonow">Spróbuj ponownie</button>
      </div>
    </div>
  </div>

  <script>
    const wzor = [
      "      ********        ********      ",
      "    ************    ************    ",
      "  **************** ****************  ",
      " *********************************** ",
      "*************************************",
      "*************************************",
      "*************************************",
      " *********************************** ",
      "  *********************************  ",
      "   *******************************   ",
      "    *****************************    ",
      "     ***************************     ",
      "       ***********************       ",
      "         *******************         ",
      "           ***************           ",
      "             ***********             ",
      "               *******               ",
      "                 ***                 ",
      "                  *                  "
    ];

    const serce = document.getElementById("serce");
    const start = document.getElementById("start");
    const koniec = document.getElementById("koniec");
    const overlay = document.getElementById("overlay");
    const tag = document.getElementById("tag");
    const tytul = document.getElementById("tytul");
    const tekst = document.getElementById("tekst");

    let kliknieciaNie = 0;

    function rysuj() {
      serce.innerHTML = "";
      serce.style.animation = "bicie 1.3s ease-in-out infinite";
      for (const linia of wzor) {
        const div = document.createElement("div");
        for (const znak of linia) {
          const span = document.createElement("span");
          span.textContent = znak;
          div.appendChild(span);
        }
        serce.appendChild(div);
      }
    }

    function wybuch(ikony) {
      serce.style.animation = "none";
      serce.querySelectorAll("span").forEach(span => {
        if (span.textContent.trim()) {
          const kat = Math.random() * Math.PI * 2;
          const dystans = 120 + Math.random() * 320;
          span.style.transform = `translate(${Math.cos(kat) * dystans}px, ${Math.sin(kat) * dystans}px) rotate(${(Math.random() - 0.5) * 720}deg) scale(0.3)`;
          span.style.opacity = "0";
        }
      });

      const r = serce.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;

      for (let i = 0; i < 45; i++) {
        const p = document.createElement("div");
        p.className = "iskra";
        p.textContent = ikony[Math.floor(Math.random() * ikony.length)];
        p.style.left = cx + "px";
        p.style.top = cy + "px";

        const kat = Math.random() * Math.PI * 2;
        const dystans = 80 + Math.random() * 280;
        p.style.setProperty("--tx", Math.cos(kat) * dystans + "px");
        p.style.setProperty("--ty", Math.sin(kat) * dystans + "px");
        p.style.setProperty("--rot", (Math.random() - 0.5) * 360 + "deg");

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1450);
      }
    }

    function reset() {
      overlay.classList.add("ukryty");
      rysuj();
    }

    document.getElementById("btnTak").onclick = () => {
      wybuch(["❤️", "💖", "💕", "✨", "🥰"]);
      setTimeout(() => {
        start.classList.add("ukryty");
        koniec.classList.remove("ukryty");
      }, 950);
    };

    document.getElementById("btnNie").onclick = () => {
      kliknieciaNie++;
      if (kliknieciaNie === 1) {
        tag.textContent = "ERROR_404:";
        tytul.textContent = "Coś tu nie działa... 🥺";
        tekst.textContent = "Przepraszam za wszystko, bardzo mi zależy, żebyś mi wybaczyła. Spróbujesz jeszcze raz? ❤️";
      } else {
        tag.textContent = "ERROR_404_AGAIN:";
        tytul.textContent = "Naprawdę bardzo przepraszam... 😭";
        tekst.textContent = "Zosiu, nie chciałem Cię urazić. Proszę, wybacz mi ❤️";
      }
      wybuch(["💔", "💧", "😢"]);
      setTimeout(() => overlay.classList.remove("ukryty"), 950);
    };

    document.getElementById("btnPonow").onclick = reset;
    overlay.onclick = e => {
      if (e.target === overlay) reset();
    };

    rysuj();
  </script>
</body>
</html>
